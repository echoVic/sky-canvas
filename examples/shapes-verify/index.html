<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Canvas · WebGPU 圆/线/文本渲染验证</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #gpu-canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
      #gpu-canvas:active { cursor: grabbing; }
      #hud {
        position: fixed; top: 12px; left: 12px; color: #e6edf3;
        background: rgba(22, 27, 34, 0.9); border: 1px solid #30363d; border-radius: 8px;
        padding: 12px 16px; font-size: 13px; line-height: 1.8; pointer-events: none;
        min-width: 260px; backdrop-filter: blur(4px);
      }
      #hud b { color: #58a6ff; }
      .fps { font-size: 20px; font-weight: 700; }
      .fps.good { color: #3fb950; }
      .fps.warn { color: #d29922; }
      .fps.bad { color: #f85149; }
      .pass { color: #3fb950; }
      .fail { color: #f85149; }
      #error {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: #0d1117; color: #f85149; font-size: 16px; text-align: center; padding: 40px;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <canvas id="gpu-canvas"></canvas>
    <div id="hud">
      <div class="fps" id="fps">-- FPS</div>
      <div>渲染器: <b>WebGPU (Instanced + SDF)</b></div>
      <hr style="border-color:#30363d;margin:6px 0" />
      <div>圆形: <b id="circle-status">--</b></div>
      <div>线条: <b id="line-status">--</b></div>
      <div>文本: <b id="text-status">--</b></div>
      <hr style="border-color:#30363d;margin:6px 0" />
      <div>总对象数: <b id="count">0</b></div>
      <div>Draw calls: <b id="drawcalls">0</b></div>
    </div>
    <div id="error"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
